[Server]
host = 0.0.0.0
port = 443
images_path = /opt/gns3/images
projects_path = /opt/gns3/projects
report_errors = True
auth = False
protocol = https
ssl = True
certfile=/home/gns3/.config/GNS3/ssl/server.cert
certkey=/home/gns3/.config/GNS3/ssl/server.key
api_port = 3000

[Qemu]
enable_kvm = false

